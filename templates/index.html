<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emotion Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0e0e11;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }
    .light {
      background-color: #f4f4f4;
      color: #111;
    }
    .sidebar {
      width: 25%;
      background-color: #1a1a1d;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 2px solid #333;
      transition: background-color 0.3s ease;
    }
    .light .sidebar {
      background-color: #e0e0e0;
    }
    .sidebar h2 {
      color: #a66df2;
      margin-bottom: 1.5rem;
    }
    .camera-box {
      background-color: #2b2b30;
      border-radius: 50%;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 1rem;
      box-shadow: 0 0 10px #a66df2;
    }
    .camera-box video,
    .camera-box img {
      width: 160px;
      height: 160px;
      object-fit: cover;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      align-items: center;
    }
    .btn {
      background: linear-gradient(135deg, #a66df2, #d37bf6);
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #a66df2;
    }
    .chat-section {
      width: 75%;
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }
    .chat-header {
      font-size: 1.4rem;
      color: #a66df2;
      margin-bottom: 1rem;
    }
    .chat-box {
      flex: 1;
      background-color: #1e1e23;
      border-radius: 10px;
      padding: 1rem;
      overflow-y: auto;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease;
    }
    .light .chat-box {
      background-color: #fff;
    }
    .message {
      padding: 0.75rem;
      margin-bottom: 0.8rem;
      border-radius: 10px;
      max-width: 70%;
      transition: all 0.3s ease;
    }
    .bot {
      background-color: #333;
      align-self: flex-start;
    }
    .light .bot {
      background-color: #ddd;
    }
    .user {
      background-color: #6a5acd;
      align-self: flex-end;
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
    }
    .chat-input input {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background-color: #2b2b30;
      color: white;
      outline: none;
    }
    .chat-input button {
      background-color: #a66df2;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Emotion Detection</h2>
  <div class="camera-box" id="cameraBox">
    <video id="videoFeed" autoplay playsinline muted style="display:none;"></video>
    <span id="cameraIcon">📸</span>
  </div>

  <div class="button-group">
    <button class="btn" id="cameraToggleBtn" title="Click to enable your camera">Enable Camera</button>
    <button class="btn" onclick="detectEmotion()">Detect Emotion</button>
    <button class="btn" onclick="toggleTheme()">Toggle Theme</button>
  </div>
</div>

<div class="chat-section">
  <div class="chat-header">Emotion-Aware Chat</div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">Hi! I'm your emotion-aware assistant. Enable the camera and let’s begin.</div>
  </div>
  <div class="chat-input">
    <input type="text" placeholder="Type your message..." id="chatInput">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
let videoStream;
let currentEmotion = "Neutral"; 

const video = document.getElementById('videoFeed');
const cameraIcon = document.getElementById('cameraIcon');
const chatBox = document.getElementById('chatBox');

function toggleTheme() {
  document.body.classList.toggle('light');
}

document.getElementById('cameraToggleBtn').addEventListener('click', async function () {
  if (!videoStream) {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = videoStream;
      video.style.display = 'block';
      cameraIcon.style.display = 'none';
      this.textContent = 'Disable Camera';
    } catch (err) {
      appendMessage('🔒 Unable to access camera. Please allow permission or check settings.', 'bot');
    }
  } else {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
    video.style.display = 'none';
    cameraIcon.style.display = 'inline';
    this.textContent = 'Enable Camera';
  }
});

function captureFrame() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const context = canvas.getContext('2d');
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg');
}

function showTyping() {
  const typing = document.createElement('div');
  typing.className = 'message bot';
  typing.id = 'typing';
  typing.textContent = 'Typing...';
  chatBox.appendChild(typing);
  typing.scrollIntoView({ behavior: 'smooth' });
}

function removeTyping() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function detectEmotion() {
  if (!videoStream) {
    appendMessage("🚫 Please enable the camera to detect your emotion.", 'bot');
    return;
  }

  const imageData = captureFrame();
  showTyping();

  fetch('http://127.0.0.1:5000/detect_emotion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: imageData })
  })
  .then(res => res.json())
  .then(data => {
    removeTyping();
    const emotion = data.emotion;
    currentEmotion = emotion;

    const emotionEmojis = {
      Angry: "😠", Disgust: "🤢", Fear: "😨", Happy: "😊",
      Sad: "😢", Surprise: "😲", Neutral: "😐"
    };
    const responses = {
      Angry: "You look upset. Want to talk about what's bothering you?",
      Disgust: "Not feeling good? I'm here if you want to share.",
      Fear: "You seem anxious. Do you want to talk about what's scaring you?",
      Happy: "You look happy! I'm glad to see that!",
      Sad: "You seem a bit down. Want to tell me why you're sad?",
      Surprise: "Something surprised you? Tell me more!",
      Neutral: "Just chilling? I'm here if you need anything."
    };

    if (emotion === "No Face Detected") {
      appendMessage("😕 I couldn't detect your face. Please sit properly and ensure your face is visible to the camera.", 'bot');
    } else if (emotion === "No Image Provided") {
      appendMessage("⚠ Couldn't receive an image from your camera.", 'bot');
    } else if (emotion === "Face Processing Error") {
      appendMessage("🚧 There was an issue analyzing your face. Please try again.", 'bot');
    } else if (emotion === "Internal Error") {
      appendMessage("❌ Server error. Please try again in a moment.", 'bot');
    } else {
      const emoji = emotionEmojis[emotion] || '';
      const message = responses[emotion] || `You seem to be feeling: ${emotion}`;
      appendMessage(`${emoji} ${message}`, 'bot');
    }
  })
  .catch(err => {
    console.error('Emotion detection failed:', err);
    removeTyping();
    appendMessage('❌ Error detecting emotion. Please try again later.', 'bot');
  });
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (message === '') return;

  appendMessage(message, 'user');
  showTyping();
  input.value = '';

  fetch('http://127.0.0.1:5000/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: `${message} (Emotion: ${currentEmotion})`
    })
  })
  .then(res => res.json())
  .then(data => {
    removeTyping();
    appendMessage(data.reply, 'bot');
  })
  .catch(err => {
    console.error('Chat error:', err);
    removeTyping();
    appendMessage('❌ Failed to fetch AI response.', 'bot');
  });
}

function appendMessage(text, sender) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${sender}`;
  msgDiv.textContent = text;
  chatBox.appendChild(msgDiv);
  msgDiv.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
